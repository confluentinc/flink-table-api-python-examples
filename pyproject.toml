[project]
name = "flink_table_api_python"
version = "0.1.0"
description = "Examples for using Python Table API with Confluent Cloud"
authors = [
    {name = "Confluent"}
]
license = {text = "Apache-2.0"}
readme = "README.md"
requires-python = ">=3.9,<3.12"
dependencies = [
    "confluent-flink-table-api-python-plugin>=1.20.52",
]


[tool.poetry]
name = "flink_table_api_python"
version = "0.1.0"
description = "Examples for using Python Table API with Confluent Cloud"
authors = ["Confluent"]
license = "Apache-2.0"
readme = "README.md"
packages = [
    {include = "examples"}
]

[tool.poetry.scripts]
example_00_hello_world = "examples.example_00_hello_world:run"
example_01_catalogs_and_databases = "examples.example_01_catalogs_and_databases:run"
example_02_unbounded_tables = "examples.example_02_unbounded_tables:run"
example_03_transforming_tables = "examples.example_03_transforming_tables:run"
example_04_creating_tables = "examples.example_04_creating_tables:run"
example_05_table_pipelines = "examples.example_05_table_pipelines:run"
example_06_values_and_data_types = "examples.example_06_values_and_data_types:run"
example_07_changelogs = "examples.example_07_changelogs:run"
example_08_integration_and_deployment = "examples.example_08_integration_and_deployment:run"

[tool.poetry.dependencies]
python = ">=3.9,<3.12"
confluent-flink-table-api-python-plugin = "1.20.52"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

